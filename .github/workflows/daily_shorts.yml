name: Daily CatHub Shorts

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Mon-Fri at 10 AM UTC (3:30 PM IST)
  workflow_dispatch:

jobs:
  generate-short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core fonts-liberation
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Decode YouTube credentials
        run: |
          mkdir -p automation
          echo "${{ secrets.YOUTUBE_TOKEN_BASE64 }}" | base64 -d > automation/youtube_token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}" | base64 -d > automation/client_secret.json

      - name: Generate shorts
        working-directory: automation
        run: python generate_short.py
        env:
          PYTHONUNBUFFERED: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAGGLE_ACCOUNTS: ${{ secrets.KAGGLE_ACCOUNTS }}

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cathub-short-${{ github.run_number }}
          path: |
            automation/output/short_*/short_*.mp4
          retention-days: 7

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/episode_counter.json automation/processed_episodes.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto: update CatHub Shorts state (run ${{ github.run_number }})"
          git push
