name: Daily Cat Podcast (1 Video + 2 Shorts)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak

      - name: Install dependencies
        run: pip install edge-tts gTTS pyttsx3 requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Decode YouTube credentials
        run: |
          mkdir -p automation
          echo "${{ secrets.YOUTUBE_TOKEN_BASE64 }}" | base64 -d > automation/youtube_token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}" | base64 -d > automation/client_secret.json

      - name: Run episode generator
        working-directory: automation
        run: python generate_episode.py
        env:
          PYTHONUNBUFFERED: 1
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            automation/output/episode_*/final_video.mp4
            automation/output/episode_*/shorts/short_*/short_video.mp4
          retention-days: 7
