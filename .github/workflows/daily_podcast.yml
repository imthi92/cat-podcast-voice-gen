name: Weekly Cat Podcast (1 Video)

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10 AM UTC
  workflow_dispatch:
  # Remote trigger hook: POST /repos/.../dispatches {"event_type":"manual-run"}
  repository_dispatch:
    types: [manual-run]

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Map secrets to env vars so we can reference them in `if:` conditions
    # (the `secrets` context is NOT allowed inside `if:` expressions).
    env:
      DEEPNOTE_WEBHOOK_URL: ${{ secrets.DEEPNOTE_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core fonts-liberation
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Decode YouTube credentials
        env:
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          YT_CLIENT_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
        # Decodes base64 (or accepts a raw value), then validates that the
        # result is real OAuth material. Fails with an exact ::error:: instead
        # of the bare "base64: invalid input" / silent empty-file behaviour.
        run: python automation/prepare_credentials.py

      - name: Run episode generator
        working-directory: automation
        run: python generate_episode.py
        env:
          PYTHONUNBUFFERED: 1
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAGGLE_ACCOUNTS: ${{ secrets.KAGGLE_ACCOUNTS }}

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            automation/output/episode_*/final_video.mp4
          retention-days: 7

      - name: Commit state + generated scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/episode_counter.json automation/processed_episodes.json automation/character_memory.json scripts/episode_ai_*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto: update podcast state (run ${{ github.run_number }})"
          git push

      # === DEEPNOTE TRIGGER (runs AFTER GitHub episode is done) ===
      - name: Trigger Deepnote pipeline
        if: ${{ env.DEEPNOTE_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ env.DEEPNOTE_WEBHOOK_URL }}/trigger" \
            -H "X-Webhook-Secret: ${{ env.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "github", "run": "${{ github.run_number }}"}' \
            --max-time 10 || echo "Deepnote trigger failed (server may be off)"
